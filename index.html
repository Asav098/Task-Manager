<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task-Manager</title>
    <link rel="stylesheet" href="CSS/style.css">
</head>
<body>
    <button id="LogOutBtn" style="display:none;">Logout</button>
    <div id="authSection">
        
        <div id="loginForm">
            <h3 class="headerbut">Login</h3>
            <label>Username</label>
            <input type="text" id="loginUsername" placeholder="Enter your username">
            <label>Password</label>
            <input type="password" id="loginPassword" placeholder="Enter your password">
            <button id="loginBtn">Login</button>

        </div>
        <div id="SignupForm">
            <h3 class="headerbut">Signup</h3>
            <label>Username</label>
            <input type="text" id="signupUsername" placeholder="Enter your username">
            <label>Password</label>
            <input type="password" id="signupPassword" placeholder="Enter your password">
            <button id="signupBtn">SignUp</button>

        </div>
    </div>
    <div id="taskManagerSection" style="display:none;">
        <h1 id="task-ma">Task Manager</h1>
        <div id="container">
        <div id="createTask">
            <input type="text" placeholder="Enter Your Task.." id="taskenter">
            <button class="buttons" id="addTask">Add</button>
            <button class="buttons" id="editbut">Edit</button>
        </div>
        <div id="taskList"></div>
        </div>
    </div>
    <script src="JS/index.js"></script>
</body>
</html>
