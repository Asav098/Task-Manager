<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task-Manager</title>
    <link rel="stylesheet" href="CSS/style.css">
</head>
<body>
    <div id="authSection">
        <div id="loginForm">
            <h3>Login</h3>
            <input type="text" id="loginUsername" placeholder="Enter your username">
            <input type="password" id="loginpassword" placeholder="Enter your password">
            <button id="loginBtn"></button>

        </div>
        <div id="SignupForm">
            <input type="text" id="signupUsername" placeholder="Enter your username">
            <input type="password" id="signupPassword" placeholder="Enter your password">
            <button id="signupBtn"></button>

        </div>
    </div>
    <h1 id="task-ma">Task Manager</h1>
    <div id="container">
    <div id="createTask">
        <input type="text" placeholder="Enter Your Task.." id="taskenter">
        <button class="buttons" id="addTask">Add</button>
        <button class="buttons" id="editbut">Edit</button>
    </div>
    <div id="taskList"></div>
    </div>
    <script src="JS/index.js"></script>
</body>
</html>
